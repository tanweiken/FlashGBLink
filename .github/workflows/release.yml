name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: make -C payload
      - run: python3 scripts/build_plugin_zip.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            payload/flasher.gba
            firmware/gbasend-pico.uf2
            firmware/gbasend-pico-rgb.uf2
            dist/FlashGBLink-plugin.zip
          # Beta/rc tags ship as pre-releases and never become "Latest", so
          # the stable tag stays the one users are pointed at.
          prerelease: ${{ contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ (contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')) && 'false' || 'legacy' }}
          # Notes come from docs/releases/<tag>.md when that file exists.
          body_path: ${{ hashFiles(format('docs/releases/{0}.md', github.ref_name)) != '' && format('docs/releases/{0}.md', github.ref_name) || '' }}
